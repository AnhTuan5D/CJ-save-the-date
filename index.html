<head>

    <!-- Tailwind CSS -->

    <!-- Google Fonts: Cormorant Garamond & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            900: '#3D1318',
                            800: '#521B21',
                            700: '#68252C',
                            600: '#83323B',
                        },
                        sand: {
                            50: '#FAF7F2',
                            100: '#F4EFE6',
                            200: '#EAE3D9',
                            300: '#D9CEBF',
                            400: '#C2B29F',
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #FAF7F2;
            color: #333;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Echter CSS-Verlauf von Burgund zu Eierschalenweiß */
        .hero-section {
            background: linear-gradient(to bottom, #521B21 0%, #521B21 70%, #FAF7F2 100%);
            color: #FAF7F2;
        }

        /* 35mm Perforations */
        .film-sprocket {
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 7px,
                #FAF7F2 7px,
                #FAF7F2 18px,
                transparent 18px,
                transparent 25px
            );
        }

        .film-strip {
            background: #181616;
            padding: 16px 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            border-radius: 4px;
        }

        .polaroid {
            background: #ffffff;
            padding: 12px 12px 32px 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            border-radius: 2px;
        }

        /* Inline Katzenpfoten Track */
        .paws-track-container {
            position: absolute;
            right: 3%;
            top: 2vh;
            bottom: 2vh;
            width: 28px;
            pointer-events: none;
            z-index: 5;
        }

        .paw-svg {
            position: absolute;
            width: 22px;
            height: 22px;
            fill: #fb923c; /* Orange */
            opacity: 0;
            transform: rotate(180deg) scale(0.6);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .paw-svg.visible {
            opacity: 0.65;
            transform: rotate(180deg) scale(1);
        }

        /* Mobile-sichere Observer Animationen */
        .reveal-left {
            opacity: 0;
            transform: translateX(-35px) rotate(-5deg);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-right {
            opacity: 0;
            transform: translateX(35px) rotate(5deg);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-active {
            opacity: 1 !important;
            transform: translateX(0) translateY(0) rotate(var(--rot, 0deg)) !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #3D1318;
        }
        ::-webkit-scrollbar-thumb {
            background: #83323B;
            border-radius: 4px;
        }
    </style>
</head>

                    <span>Datum vormerken</span>
